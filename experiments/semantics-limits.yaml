name: semantics-limits
description: Where OBGP reaches its limits, each case on its own network. The simulator's smallest counterexamples outside and inside the model, and Abilene as one AS with iBGP through two route reflectors, its direct entry failing and returning. To compare how often each mode fails in the lab and in the simulator.
cluster: {cpus: 4, memory_mb: 8192}
runs: 6
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp-rp, mode: obgp-rp}
  - {name: obgp-rp-delay, mode: obgp-rp, refresh_delay: 1}
  - {name: obgp-sp, mode: obgp-sp}
  - {name: obgp-hp, mode: obgp-hp}
  - {name: obgp-np, mode: obgp-np}
  - {name: obgp-paper, mode: obgp-paper}
topologies: [sim-gao-rexford-obgp-rp-unreachable, sim-import-filter-obgp-hp-unreachable, sim-local-pref-bgp-no-convergence, sim-route-leak-bgp-no-convergence, sim-route-leak-obgp-rp-leaked, sim-tagging-obgp-rp-unreachable, abilene-as]
paired: true
scenarios:
  - sim-gao-rexford-obgp-rp-unreachable
  - sim-import-filter-obgp-hp-unreachable
  - sim-local-pref-bgp-no-convergence
  - sim-route-leak-bgp-no-convergence
  - sim-route-leak-obgp-rp-leaked
  - sim-tagging-obgp-rp-unreachable
  - abilene-as
