name: valley-free
description: No route passes a stub that does not announce it. Where the topology names them, the routers in `one-table-loses` may lose the prefixes of `one-table-sources` with one OBGP table.
steps:
  - announce: {rate: 2, for: 15}
  - until_stable: {timeout: 60}
  - parallel:
      - expect: {router: tier1, avoid: s-b}
      - expect: {router: tier1, avoid: s-d}
      - expect: {router: tier1, avoid: s-e}
      - expect: {router: one-table-loses, of: one-table-sources, may_fail: [obgp-rp, obgp-sp, obgp-hp, obgp-np, obgp-paper]}
