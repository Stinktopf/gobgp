{{- range $name, $r := .Values.routers }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  # Neighbors resolve each other before their sessions are up.
  publishNotReadyAddresses: true
  selector:
    app: {{ $name }}
  ports:
    - name: api
      port: 8080
      targetPort: api
---
{{- end }}
