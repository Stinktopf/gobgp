name: semantics-gao-rexford
description: Whether routes stay valley-free on three tiers that follow Gao-Rexford, filled and drained.
cluster: {cpus: 12, memory_mb: 13000}
runs: 6
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp-rp, mode: obgp-rp}
  - {name: obgp-rp-delay, mode: obgp-rp, refresh_delay: 1}
  - {name: obgp-sp, mode: obgp-sp}
  - {name: obgp-hp, mode: obgp-hp}
  - {name: obgp-np, mode: obgp-np}
  - {name: obgp-paper, mode: obgp-paper}
  - {name: hybrid-rp, mode: hybrid-rp}
  - {name: random-rp, mode: random-rp, share: 0.5}
topologies: [gao-rexford-20]
scenarios:
  - fill-60
  - full-drain-60
  - valley-free
