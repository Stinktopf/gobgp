# The lab sets the image, the seed and the BGP timers for every run and
# passes the routers of the topology with -f, each with the environment of
# its mode; the chart requires them.
image:
  pullPolicy: Never
routers: {}
# Memory per router, in MiB: the request reserves it, so that routers that
# do not fit stay pending instead of overloading the node, and the limit
# ends a single router that takes too much. The lab sets both.
memory: {}
