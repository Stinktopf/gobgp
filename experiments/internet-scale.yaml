name: internet-scale
description: How BGP and OBGP scale with the routers, on the core of the Internet, the 32, 64, 128 and 256 largest networks by AS Rank, with their real prefixes.
# The largest networks of core-256 hold close to 200 sessions each.
cluster: {cpus: 128, memory_mb: 524288}
runs: 6
sampling: {interval: 1.0, stable_s: 5}
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp-rp, mode: obgp-rp}
  - {name: obgp-rp-delay, mode: obgp-rp, refresh_delay: 1}
  - {name: obgp-rp-pn, mode: obgp-rp, per_neighbor: true}
  - {name: obgp-sp, mode: obgp-sp}
  - {name: obgp-sp-pn, mode: obgp-sp, per_neighbor: true}
  - {name: obgp-hp, mode: obgp-hp}
  - {name: obgp-hp-pn, mode: obgp-hp, per_neighbor: true}
  - {name: obgp-np, mode: obgp-np}
  - {name: obgp-np-pn, mode: obgp-np, per_neighbor: true}
  - {name: obgp-paper, mode: obgp-paper}
topologies: [core-32, core-64, core-128, core-256]
scenarios: [real-fill-20]
primary: {metric: rss_mean, variant: obgp-rp, baseline: bgp}
