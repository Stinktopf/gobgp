name: fill-60-reach
description: Announce about 60 prefixes, as fill-60. Where the topology names them, the routers in `one-table-loses` may lose the prefixes of `one-table-sources` with one OBGP table.
steps:
  - announce: {rate: 2, for: 30}
  - wait: 10
  - expect: {router: one-table-loses, of: one-table-sources, may_fail: [obgp-rp, obgp-sp, obgp-hp, obgp-np, obgp-paper]}
