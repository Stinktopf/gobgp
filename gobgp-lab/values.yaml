# The lab sets the image, the seed and the BGP timers for every run and
# passes the routers of the topology with -f, each with the environment of
# its mode; the chart requires them.
image:
  pullPolicy: Never
routers: {}
# Memory per router, in MiB: the limit ends a single router that takes too
# much. The node reports the host's memory, so the request holds no router
# back: the lab checks before a run that the routers fit. The lab sets both.
memory: {}
# Seconds between two readiness probes, longer among many routers. The lab sets it.
probe: {}
# The routers whose pods a deploy creates, all when empty.
deploy: []
