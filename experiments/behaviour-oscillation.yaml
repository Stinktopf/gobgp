name: behaviour-oscillation
description: Whether routes oscillate or only explore paths slowly, with two minutes of rest.
cluster: {cpus: 12, memory_mb: 13000}
runs: 6
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp-rp, mode: obgp-rp}
  - {name: obgp-rp-delay, mode: obgp-rp, refresh_delay: 1}
  - {name: obgp-sp, mode: obgp-sp}
  - {name: obgp-hp, mode: obgp-hp}
  - {name: obgp-np, mode: obgp-np}
  - {name: obgp-paper, mode: obgp-paper}
topologies: [bad-gadget, noble-eu, germany50]
scenarios: [fill-30-rest-120]
