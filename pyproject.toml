[project]
name = "obgp-lab"
version = "0.1.0"
description = "Emulation lab for evaluating OBGP against BGP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "jinja2>=3.1",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "requests>=2.32",
  "uvicorn>=0.35",
]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]
# Installed in the router image only, see Dockerfile.
controller = [
  "fastapi>=0.116",
  "grpcio>=1.74",
  "grpcio-tools>=1.74",
  "protobuf>=6.32",
  "pydantic>=2.11",
  "uvicorn>=0.35",
]
# For scripts/build-assets.py.
assets = ["fonttools>=4.60", "playwright>=1.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["api", "tools", "docs", "vis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines and small lambdas are the style of the lab; HTTP errors need no cause.
ignore = ["E501", "E731", "B904", "B905"]
