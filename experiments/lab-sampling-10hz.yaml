name: lab-sampling-10hz
description: Whether sampling changes what it measures, at 10 Hz. Compare with lab-sampling-1hz.
cluster: {cpus: 12, memory_mb: 13000}
runs: 6
sampling: {interval: 0.1, stable_s: 3}
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp, mode: obgp}
topologies: [noble-eu]
scenarios: [fill-60]
