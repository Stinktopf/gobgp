{{- range $name, $r := .Values.routers }}
{{- if or (not $.Values.deploy) (has $name $.Values.deploy) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      # Routers are replaced for every run; they need no time to shut down.
      terminationGracePeriodSeconds: 2
      # No variables for every service of the namespace: hundreds of routers would get thousands each.
      enableServiceLinks: false
      # The lab sends every controller its neighbors' pod addresses, kept here across restarts of the container.
      volumes:
        - name: state
          emptyDir: {}
      containers:
        - name: router
          image: "{{ required "the lab sets image.repository" $.Values.image.repository }}:{{ required "the lab sets image.tag" $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/lab
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ROUTER_NAME
              value: {{ $name | quote }}
            - name: ASN
              value: "{{ $r.asn }}"
            - name: ROUTER_ID
              value: "{{ $r.routerId }}"
            - name: NEIGHBORS_JSON
              value: {{ toJson ($r.neighbors | default list) | quote }}
            - name: LEAK
              value: {{ $r.leak | default false | quote }}
            - name: CONFEDERATION
              value: {{ $r.confederation | default "" | quote }}
            - name: CONFED_MEMBERS
              value: {{ toJson ($r.confedMembers | default list) | quote }}
            # The mode of the daemon, e.g. GOBGP_OPERA_ENABLED.
            {{- range $k, $v := required (printf "the lab sets routers.%s.env" $name) $r.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: LAB_SEED
              value: {{ required "the lab sets seed" $.Values.seed | quote }}
            - name: HOLD_TIME
              value: {{ required "the lab sets bgp.holdTime" $.Values.bgp.holdTime | quote }}
            - name: KEEPALIVE
              value: {{ required "the lab sets bgp.keepalive" $.Values.bgp.keepalive | quote }}
            - name: CONNECT_RETRY
              value: {{ required "the lab sets bgp.connectRetry" $.Values.bgp.connectRetry | quote }}
            - name: GRACEFUL_RESTART
              value: {{ required "the lab sets bgp.gracefulRestart" $.Values.bgp.gracefulRestart | quote }}
            - name: MRAI
              value: {{ required "the lab sets bgp.mrai" $.Values.bgp.mrai | quote }}
            - name: GOBGPD_PROCS
              value: {{ $.Values.bgp.procs | default 0 | quote }}
            # The controller reads no advertised counts: counting them walks the table per peer at every scrape.
            - name: GOBGP_METRICS_ADVERTISED
              value: "0"
            - name: GOBGP_OPERA_REFRESH_S
              value: {{ required "the lab sets bgp.refresh" $.Values.bgp.refresh | quote }}
            - name: GOBGP_OPERA_REFRESH_DELAY_S
              value: {{ required "the lab sets bgp.refreshDelay" $.Values.bgp.refreshDelay | quote }}
          {{- with $.Values.memory }}
          resources:
            requests:
              memory: "{{ .requestMi }}Mi"
            limits:
              memory: "{{ .limitMi }}Mi"
          {{- end }}
          # Link failures and degradation use iptables and tc.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - name: bgp
              containerPort: 179
            - name: api
              containerPort: 8080
          # Ready once all BGP sessions are established.
          readinessProbe:
            httpGet:
              path: /ready
              port: api
            periodSeconds: {{ $.Values.probe.periodS | default 2 }}
            timeoutSeconds: 3
---
{{- end }}
{{- end }}
