name: internet-dfz
description: How BGP and OBGP handle full tables of the Internet, injected at the four largest Tier-1 networks of the 32 largest networks.
# About 12 GB for the largest routers, 360 GB in all. Check with lab rib core-32 which networks peer with RIS.
cluster: {cpus: 64, memory_mb: 471040, router_limit_mb: 16384}
runs: 6
sampling: {interval: 1.0, stable_s: 5}
variants:
  - {name: bgp, mode: bgp}
  - {name: obgp, mode: obgp}
  - {name: obgp-np, mode: obgp-np}
topologies: [core-32]
scenarios: [dfz-fill-drain]
